name: V2 smoke

on:
  pull_request:
    branches:
      - staging
      - master
      - feature/chalk-2.0-renovation
  push:
    branches:
      - feature/chalk-2.0-renovation

jobs:
  v2-smoke:
    name: V2 smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          CXXFLAGS: -Wno-error

      - name: Run V2 static smoke gates
        run: yarn run v2:ci:smoke

      - name: Build staging bundle
        run: |
          yarn run removebuild
          yarn run staging
        env:
          CXXFLAGS: -Wno-error

      - name: Start local V2 server
        run: |
          yarn run localdev > /tmp/chalk-v2-server.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8080 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/chalk-v2-server.log
          exit 1
        env:
          CXXFLAGS: -Wno-error

      - name: Run scoped V2 Cypress smoke
        run: yarn run v2:cypress:smoke
